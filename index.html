  <!-- Both faces are preloaded: Geist sets everything that is read and Wingman
       the wordmark and headings, so a swap flash in either is the layout
       reflowing rather than one line of type. -->

       intro is: it only ever adds a section, and never touches the sheet. -->
  <link rel="stylesheet" href="/photos.css">

  <!-- The sheet: inset by --frame on every side so the page's own background
       shows through as a solid, untextured border. Everything readable lives
       inside it; the paper grain is painted by its two pseudo-elements. -->

    <!-- Draughtsman's layer: rulers, registration marks and dimension
         annotations, drawn faintly over the paper like notations in a codex.
         Decorative only, hence aria-hidden and pointer-events: none. -->

      <span class="spec-ruler spec-ruler--t"></span>
      <span class="spec-ruler spec-ruler--r"></span>
      <span class="spec-ruler spec-ruler--b"></span>
      <span class="spec-ruler spec-ruler--l"></span>

      <span class="spec-frame"></span>

      <span class="spec-mark spec-mark--tl"></span>
      <span class="spec-mark spec-mark--tr"></span>
      <span class="spec-mark spec-mark--bl"></span>
      <span class="spec-mark spec-mark--br"></span>

      <span class="spec-dim spec-dim--w"></span>
      <span class="spec-label spec-label--w">20</span>
      <span class="spec-dim spec-dim--h"></span>
      <span class="spec-label spec-label--h">24</span>
    </div>

    <!-- The masthead row. At home this is nothing but the centred lockup, laid
         out exactly as it always was; in a section it stretches to the sheet's
         width, the name shrinks into the top-left corner, and the reader's
         expand control joins it on the right. Wrapping the lockup rather than
         restyling it is what keeps the home layout untouched. -->
    <div class="masthead">
      <main class="lockup">
        <!-- The name is the one thing the erase never takes. In a section the
             small version of it is the way back, which is why it's a link. -->
        <h1 class="name"><a class="name-home" href="#">Luke van Zyl</a></h1>
        <p class="bio">
          <span class="bio-line" style="--i:0">Product designer, digital tinkerer,</span><br>
          <span class="bio-line" style="--i:1">and systems thinker. Currently</span><br>
          <span class="bio-line" style="--i:2">head of design at Instinct.</span>
        </p>
      </main>

      <!-- The way home, in a section: the section's title behind a chevron, in
           the navigation's own voice. Hidden at home; js/paper.js fills in the
           title as a section opens. -->
      <a class="back" id="back" href="#">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg>
        <span><span class="sr-only">Back to the sheet from </span><span id="backTitle">Writing</span></span>
      </a>

      <!-- Collapses the index so the piece is the only thing left on the
           sheet. Hidden until a section opens; js/paper.js owns its state. -->
      <button class="expand" id="expand" type="button" aria-pressed="false" hidden>
        <svg class="expand-icon expand-icon--out" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.4 1.9H1.9v4.5M9.6 14.1h4.5V9.6"/>
          <path d="M1.9 1.9l4.8 4.8M14.1 14.1L9.3 9.3"/>
        </svg>
        <svg class="expand-icon expand-icon--in" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1.9 6.4h4.5V1.9M14.1 9.6H9.6v4.5"/>
          <path d="M1.9 1.9l4.5 4.5M14.1 14.1L9.6 9.6"/>
        </svg>
        <span class="sr-only" id="expandLabel">Hide the index</span>
      </button>
    </div>

    <!-- The reading spread: the index of titles on the left, the open piece on
         the right, each scrolling its own column. Empty and hidden until a
         section is routed to, so with JS off it never exists. -->
    <section class="spread" id="spread" hidden aria-label="Writing">
      <nav class="index" id="index">
        <ol class="index-list" id="indexList"></ol>
      </nav>
      <article class="page">
        <div class="page-scroll" id="pageScroll">
          <header class="page-head">
            <h2 class="page-title" id="pageTitle"></h2>
            <p class="page-meta" id="pageMeta"></p>
          </header>
          <div class="prose" id="prose"></div>
        </div>
      </article>
    </section>

    <!-- The photographs. `.spread`'s sibling and the other thing a section can
         open onto: one full-width scroller, because a photo essay is a column
         you fall down rather than a text read beside an index. Empty until
         js/photos.js paints into it, and hidden until a route asks for it. -->
    <section class="plates" id="plates" hidden aria-label="Photographs">
      <div class="plates-scroll" id="platesScroll"></div>
    </section>

    <!-- The main navigation, standing where the social row used to. The
         sections are what there is to reach for from the landing page; the
         accounts are not, and they have moved under the corner.

         ⚠️ Still `.links`, and still the grid's second row. js/paper.js rubs
         this element out by name and intro.css settles it on arrival — it is
         a POSITION on the sheet, not a description of what is in it, and
         renaming it would quietly drop the row out of both. -->
    <nav class="links" aria-label="Sections">
      <a href="#writing">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></svg>
        <span>Writing</span>
      </a>
      <a href="#photos">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8h.01"/><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12"/><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/></svg>
        <span>Photos</span>
      </a>
      <a href="#more">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></svg>
        <span>More</span>
      </a>
    </nav>

    <!-- The rubber tip. Rides along each line of type as the copy is erased;
         its position is driven from js/paper.js. Sits above everything, so it
         passes over the words rather than under them. -->
    <div class="erase" aria-hidden="true"><span class="rubber" id="rubber"></span></div>

    <!-- Hover the right edge and the bottom-right corner lifts, the way you
         lift a page to see what's under it. The dog-ear is two triangles:
         .curl-hole is the gap the paper left (and holds the nav), .curl-flap
         is the folded-over corner lying on top of the page. A small ear is
         always showing, so there is something to notice before you hover. -->
    <div class="curl-zone" aria-hidden="true"></div>
    <div class="curl">
      <div class="curl-hole">
        <!-- The accounts, marks only. They had the centred row at the foot of
             the sheet; the navigation has it now, and these are the kind of
             thing you go looking for rather than the kind you are offered.

             ⚠️ Each one needs a name it doesn't show. aria-label carries it
             to a screen reader and title gives the pointer a tooltip, since a
             stroke glyph on its own is a guess. -->
        <footer class="curl-links">
          <a href="https://www.linkedin.com/in/lukevz/" rel="me noopener" title="LinkedIn" aria-label="LinkedIn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11v5"/><path d="M8 8v.01"/><path d="M12 16v-5"/><path d="M16 16v-3a2 2 0 1 0 -4 0"/><path d="M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4l0 -10"/></svg></a>
          <a href="https://x.com/lukevz" rel="me noopener" title="X" aria-label="X"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l11.733 16h4.267l-11.733 -16l-4.267 0"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg></a>
          <a href="https://www.youtube.com/@lukevanzylofficial" rel="me noopener" title="YouTube" aria-label="YouTube"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8a4 4 0 0 1 4 -4h12a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-12a4 4 0 0 1 -4 -4v-8"/><path d="M10 9l5 3l-5 3l0 -6"/></svg></a>
          <a href="https://www.instagram.com/lukevanzyl/" rel="me noopener" title="Instagram" aria-label="Instagram"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a4 4 0 0 1 4 -4h8a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-8a4 4 0 0 1 -4 -4l0 -8"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M16.5 7.5v.01"/></svg></a>
          <a href="https://github.com/Lukevz" rel="me noopener" title="GitHub" aria-label="GitHub"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"/></svg></a>
        </footer>
      </div>
      <span class="curl-flap" aria-hidden="true"></span>
    </div>

  </div>

  <!-- Sections only. The landing page itself needs none of this — with the
       script blocked, `/` is the page it has always been.

       ⚠️ Order matters. Both are deferred, so they run in document order, and
       paper.js reads `window.photoSection` on its very first route() — which
       runs at the end of its own script. Load photographs first or landing
       straight on a `#photos` URL falls back to the sheet. -->
  <script src="/js/photos.js" defer></script>
  <script src="/js/paper.js" defer></script>

</body>
