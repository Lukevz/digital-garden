       intro is: it only ever adds a section, and never touches the sheet. -->

<body>
  <!-- Refraction for the glass fade under a post (styles.css, `.page::after`).
       A slow turbulence pushes the blurred text behind the pane sideways a
       few pixels, so it reads as seen through liquid rather than through a
       frosted plain. Chromium only; elsewhere the pane keeps its blur and
       sheen. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.028" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- The sheet: inset by --frame on every side so the page's own background
       shows through as a solid, untextured border. Everything readable lives
       inside it; the paper grain is painted by its two pseudo-elements. -->
  <div class="sheet">

    <!-- Draughtsman's layer: rulers, registration marks and dimension
         annotations, drawn faintly over the paper like notations in a codex.
         Decorative only, hence aria-hidden and pointer-events: none. -->
    <div class="spec" aria-hidden="true">
      <span class="spec-ruler spec-ruler--t"></span>
      <span class="spec-ruler spec-ruler--r"></span>
      <span class="spec-ruler spec-ruler--b"></span>
      <span class="spec-ruler spec-ruler--l"></span>

      <span class="spec-frame"></span>

      <span class="spec-mark spec-mark--tl"></span>
      <span class="spec-mark spec-mark--tr"></span>
      <span class="spec-mark spec-mark--bl"></span>
      <span class="spec-mark spec-mark--br"></span>

      <span class="spec-dim spec-dim--w"></span>
      <span class="spec-label spec-label--w">20</span>
      <span class="spec-dim spec-dim--h"></span>
      <span class="spec-label spec-label--h">24</span>
    </div>

         is written on the sheet and it outlives the draughtsman's marks.

         marks below takes its place; click anywhere else, or Escape, and it
         etches back in. js/paper.js, "The monogram hides the accounts". In a
         section it is only the mark in the masthead, and paper.js takes it out

    <svg class="letterhead" viewBox="0 0 1641 621" width="1641" height="621" fill="none" xmlns="http://www.w3.org/2000/svg" role="button" tabindex="0" aria-label="Luke van Zyl: show social links" aria-controls="socials" aria-expanded="false">

    <!-- The masthead row. At home this is nothing but the centred lockup, laid
         out exactly as it always was; in a section it stretches to the sheet's
         width, the name shrinks into the top-left corner, and the reader's
         expand control joins it on the right. Wrapping the lockup rather than
         restyling it is what keeps the home layout untouched. -->
    <div class="masthead">
      <main class="lockup">
        <!-- The name is the one thing the erase never takes. In a section the
             small version of it is the way back, which is why it's a link. -->
        <h1 class="name"><a class="name-home" href="#">Luke van Zyl</a></h1>
        <p class="bio">
          <span class="bio-line" style="--i:0">Product designer, digital tinkerer,</span><br>
          <span class="bio-line" style="--i:1">and systems thinker. Currently</span><br>
          <span class="bio-line" style="--i:2">head of design at Instinct.</span>
        </p>
      </main>

      <!-- The way back, in a section: "Back" behind a chevron, in the
           navigation's own voice. It steps back to wherever you came from
           (js/paper.js, "Back"), so it names no page — every section carries
           its own, larger, title just below the masthead. Hidden at home. -->
      <a class="back" id="back" href="#">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg>
        <span>Back</span>
      </a>

      <!-- The accounts, right of the masthead, in a section. Empty in the
           markup: js/paper.js copies the marks in from `#socials` so the list
           lives in one place. Hidden at home, where the monogram has them. -->
      <div class="mast-links" id="mastLinks"></div>
    </div>

    <!-- The reading spread: the index of titles on the left, the open piece on
         the right, each scrolling its own column. Empty and hidden until a
         section is routed to, so with JS off it never exists. -->
    <section class="spread" id="spread" hidden aria-label="Writing">
      <nav class="index" id="index">
        <ol class="index-list" id="indexList"></ol>
      </nav>
      <article class="page">
        <!-- Hides / shows the index. Top-left of the card, and a sidebar mark
             rather than a corner-arrows one: it is the sidebar it closes.
             Hidden until a section opens; js/paper.js owns its state. -->
        <button class="expand" id="expand" type="button" aria-pressed="false" hidden>
          <svg class="expand-icon expand-icon--out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M9 4v16"/><path d="M15 10l-2 2l2 2"/>
          </svg>
          <svg class="expand-icon expand-icon--in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M9 4v16"/><path d="M14 10l2 2l-2 2"/>
          </svg>
          <span class="sr-only" id="expandLabel">Hide the index</span>
        </button>
        <div class="page-scroll" id="pageScroll">
          <header class="page-head">
            <h2 class="page-title" id="pageTitle"></h2>
            <p class="page-meta" id="pageMeta"></p>
          </header>
          <div class="prose" id="prose"></div>
          <!-- Two more posts, under a rule. Filled by showPost() once the piece
               has loaded; hidden until then. -->
          <aside class="read-next" id="readNext" aria-label="Read next" hidden></aside>
        </div>
      </article>
    </section>

    <!-- The photographs. `.spread`'s sibling and the other thing a section can
         open onto: one full-width scroller, because a photo essay is a column
         you fall down rather than a text read beside an index. Empty until
         js/photos.js paints into it, and hidden until a route asks for it. -->
    <section class="plates" id="plates" hidden aria-label="Photographs">
      <div class="plates-scroll" id="platesScroll"></div>
    </section>

    <!-- The smaller pages (bookshelf, gear, app stack, places) and Resources. One simple
         scroller that js/more.js fills; the fourth surface a section can open
         onto, and the plainest — a title and a list. Empty and hidden until a
         route asks for it. -->
    <section class="folio" id="folio" hidden aria-label="More">
      <div class="folio-scroll" id="folioScroll"></div>
    </section>

    <!-- The main navigation, standing where the social row used to. The
         sections are what there is to reach for from the landing page; the
         accounts are not, and they have moved under the corner.

         ⚠️ Still `.links`, and still the grid's second row. js/paper.js rubs
         this element out by name and intro.css settles it on arrival — it is
         a POSITION on the sheet, not a description of what is in it, and
         renaming it would quietly drop the row out of both. -->
    <nav class="links" aria-label="Sections">

    <!-- The rubber tip. Rides along each line of type as the copy is erased;
         its position is driven from js/paper.js. Sits above everything, so it
         passes over the words rather than under them. -->
    <div class="erase" aria-hidden="true"><span class="rubber" id="rubber"></span></div>

    <!-- Hover the right edge and the bottom-right corner lifts, the way you
         lift a page to see what's under it. The dog-ear is two triangles:
         .curl-hole is the gap the paper left (and holds the nav), .curl-flap
         is the folded-over corner lying on top of the page. A small ear is
         always showing, so there is something to notice before you hover. -->
    <div class="curl-zone" aria-hidden="true"></div>
    <div class="curl">
      <div class="curl-hole">
        <!-- The smaller pages — bookshelf, gear, app stack, places — as marks
             only, one per row down the right edge. They were a second row
             behind a "More" toggle in the nav; the accounts that used to live
             here are behind the monogram now.

             ⚠️ Each one needs a name it doesn't show: aria-label for a screen
             reader, title for the pointer tooltip. -->
